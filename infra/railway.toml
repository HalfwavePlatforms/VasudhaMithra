# Railway deploy config — only relevant if you're doing the hosted-backup path
# (see docs/deployment.md). Deploy api-gateway, upload-portal, and dashboard
# as three separate Railway services pointing at this repo, each using the
# build config below scoped to its own Dockerfile.

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
