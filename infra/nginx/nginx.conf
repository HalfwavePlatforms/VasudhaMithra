events {}

http {
    upstream api_gateway { server api-gateway:8000; }
    upstream upload_portal { server upload-portal:3000; }
    upstream dashboard { server dashboard:3001; }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /dashboard/ {
            proxy_pass http://dashboard/;
        }

        location / {
            proxy_pass http://upload_portal/;
        }
    }
}
