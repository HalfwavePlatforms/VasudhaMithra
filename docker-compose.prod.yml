# Production-mode overlay: no bind mounts (baked images only), restart policies
# on, nginx fronts everything on one port. Run this the night before demo day
# to catch any "works in dev, breaks in prod build" surprises early.
#
# Usage: docker-compose -f docker-compose.prod.yml up --build

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr-pipeline:
    build: ./services/ocr-pipeline
    env_file: .env
    ports:
      - "8001:8001"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s

  extraction-engine:
    build: ./services/extraction-engine
    env_file: .env
    ports:
      - "8002:8002"
    restart: on-failure
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s

  gis-service:
    build: ./services/gis-service
    env_file: .env
    ports:
      - "8003:8003"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s

  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s

  upload-portal:
    build:
      context: ./frontend/upload-portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: on-failure
    depends_on:
      - api-gateway

  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    restart: on-failure
    depends_on:
      - api-gateway


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - upload-portal
      - dashboard

volumes:
  pgdata:
